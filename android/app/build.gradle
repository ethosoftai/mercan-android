plugins {
    id 'com.android.application'
}

// Optional local secrets (never committed): keystore.properties next to this file.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }

android {
    namespace 'ai.mercan.app'
    compileSdk 35
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "ai.mercan.app"
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName "0.7.0"
        // Model source. Point MODEL_URL at a private/gated endpoint and set MODEL_AUTH_TOKEN
        // (via keystore.properties or env) for anything that is not meant to be public.
        buildConfigField "String", "MODEL_URL", "\"${keystoreProps.getProperty('modelUrl', System.getenv('MERCAN_MODEL_URL') ?: 'https://huggingface.co/MercanAI/Mercan-0.8B-Preference-Plus-Q4/resolve/main/Mercan-0.8B-Preference-Plus-Q4_K_M.mercan?download=true')}\""
        // Ağırlıkların kimliği: değişince telefondaki eski model silinip yenisi indirilir.
        buildConfigField "String", "MODEL_ID", "\"preference-plus-q4-20260928\""
        buildConfigField "String", "MODEL_AUTH_TOKEN", "\"${keystoreProps.getProperty('modelToken', System.getenv('MERCAN_MODEL_TOKEN') ?: '')}\""
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared",
                          "-DANDROID_PLATFORM=android-26",
                          "-DMERCAN_BUILD_JNI=ON", "-DMERCAN_BUILD_GUI=OFF", "-DMERCAN_BUILD_CLI=OFF",
                          "-DMERCAN_BUILD_STT=ON",
                          "-DMERCAN_WHISPER_DIR=${System.getenv('MERCAN_WHISPER_DIR') ?: '/root/work/whisper.cpp'}",
                          "-DMERCAN_REPO_DIR=${System.getenv('MERCAN_REPO_DIR') ?: rootProject.file('../../repo').absolutePath}",
                          "-DMERCAN_LLAMA_DIR=${System.getenv('MERCAN_LLAMA_DIR') ?: rootProject.file('../../repo/build/_deps/llama-src').absolutePath}",
                          "-DNEDO004_FFI_LIB=${System.getenv('NEDO004_FFI_LIB') ?: ''}",
                          "-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,max-page-size=16384",
                          "-DCMAKE_MODULE_LINKER_FLAGS=-Wl,-z,max-page-size=16384",
                          "-DCMAKE_C_FLAGS_RELWITHDEBINFO=-O3 -DNDEBUG", "-DCMAKE_CXX_FLAGS_RELWITHDEBINFO=-O3 -DNDEBUG",
                          "-DCMAKE_C_FLAGS_RELEASE=-O3 -DNDEBUG", "-DCMAKE_CXX_FLAGS_RELEASE=-O3 -DNDEBUG"
                targets "mercan_jni",
                        "ggml-cpu-android_armv8.0_1", "ggml-cpu-android_armv8.2_1", "ggml-cpu-android_armv8.2_2",
                        "ggml-cpu-android_armv8.6_1", "ggml-cpu-android_armv9.0_1", "ggml-cpu-android_armv9.2_1",
                        "ggml-cpu-android_armv9.2_2"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
        }
    }

    androidResources {
        // The speech model is already quantised; storing it plain keeps the first copy fast.
        noCompress 'bin'
    }

    signingConfigs {
        release {
            if (keystoreProps.getProperty('storeFile')) {
                storeFile rootProject.file(keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            // R8: shrink + obfuscate Java; native symbols are stripped by AGP on packaging.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig keystoreProps.getProperty('storeFile') ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    packaging {
        jniLibs {
            // Backends are dlopen()ed by path, so the .so files must be extracted on install.
            useLegacyPackaging = true
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
}
